
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitnessApp - QA Report</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --surface-color: #151a2a;
            --surface-light: #1e2638;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.4);
            --border: #2a3143;
            
            --high-risk: #ef4444;
            --medium-risk: #f59e0b;
            --low-risk: #10b981;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 60px 20px;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1300px;
            margin: 0 auto;
            background: var(--surface-color);
            padding: 50px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 3rem;
            text-align: center;
            margin-bottom: 50px;
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px var(--accent-glow);
        }

        h2 {
            font-size: 1.8rem;
            border-bottom: 2px solid var(--border);
            padding-bottom: 12px;
            margin-top: 50px;
            color: #f1f5f9;
        }

        ul {
            background: var(--surface-light);
            padding: 20px 40px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-top: 30px;
            background: var(--surface-light);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        th, td {
            padding: 18px 24px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: #0f172a;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.1em;
            color: var(--text-muted);
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr {
            transition: all 0.2s ease;
        }

        tr:hover td {
            background-color: rgba(255, 255, 255, 0.03);
        }

        td {
            font-size: 0.95rem;
            vertical-align: top;
        }
        
        td strong {
            color: #cbd5e1;
        }

        /* Severity Badges */
        .badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        
        code {
            background: rgba(0, 0, 0, 0.3);
            padding: 4px 8px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            color: #93c5fd;
            border: 1px solid var(--border);
            font-size: 0.85rem;
        }

        a {
            color: var(--accent);
            text-decoration: none;
            transition: text-shadow 0.2s;
        }
        
        a:hover {
            text-shadow: 0 0 10px var(--accent-glow);
        }

    </style>
</head>
<body>
    <div class="container" id="content">
        <!-- Content will be injected here -->
    </div>

    <script>
        const markdownContent = "# QA Report & Suggestions - FitnessApp\n\nThis document provides a consolidated, readable view of the testing and QA documentation for the **FitnessApp**.\n\n---\n\n## 1. Project Overview (README)\n\n**Application Details:**\n- **Name:** FitnessApp\n- **Category:** Fitness & Wellness Mobile App\n- **Environment:** Android Mobile\n\nThis project tracks Quality Assurance documentation, bug reports, and feature suggestions for the FitnessApp. It consists of a detailed log of bugs discovered during exploratory manual testing, categorized by severity and module (Water Intake, Qibla Compass, Prayer Time, Fasting Tracker, QuickFit, Community Feed, Workout Hub). It also includes proposed enhancements and backlog suggestions to improve user experience.\n\n---\n\n## 2. Bug Master Log\n\n**Testing Mode:** Exploratory Manual Testing  \n**Date:** August 3, 2026  \n**Total Bugs Logged:** 51  \n\n| Bug ID | Module / Screen | Summary / Technical Description | Severity | Recommended Fix |\n| :--- | :--- | :--- | :--- | :--- |\n| **BUG-01** | Water Intake / Today's Intake | **No Undo/Decrement Mechanism:** Once water glasses are logged by tapping, tapping them again does not untap/remove them. No UI control exists to undo an accidental entry. | **Medium** | Implement toggle logic (tap active glass to deselect) or add explicit `+ / -` counter controls. |\n| **BUG-02** | Water Intake / Today's Intake | **Hard Cap on Goal Target:** Intake logging is strictly capped at the set daily goal (e.g., 12 glasses). Dynamic grid expansion or floating `+` controls to log excess intake are missing. | **Medium** | Allow intake count and bar chart rendering to scale dynamically above 100% of target. |\n| **BUG-03** | Water Intake / Water Trend | **UI Text Overlap on X-Axis:** X-axis day label `\"Wed\"` wraps incorrectly, spilling the letter `\"d\"` directly onto the `\"Days\"` axis title. | **Low** | Adjust container padding/flexbox layout properties on chart axis text elements. |\n| **BUG-04** | Water Intake / Goal Completion | **Missing Goal Completion State:** Reaching 100% daily intake goal produces no visual feedback, toast animation, sound, or haptic confirmation. | **Medium** | Add completion trigger (e.g., Lottie animation / victory toast) upon reaching 100% target. |\n| **BUG-05** | Qibla Compass | **Incorrect Cardinal Layout & Dial Rotation:** Cardinal directions (N, S, E, W) are misaligned around the dial. Device rotation turns only the needle while the compass housing remains static. | **High** | Recalibrate spatial mapping; ensure background dial rotates relative to magnetometer heading. |\n| **BUG-06** | Qibla Compass | **Unanchored Floating UI Element:** A small green icon (prayer mat/book) renders outside compass dial borders without proper layout constraints. | **Medium** | Enforce flexbox/relative constraints on icon position within parent container. |\n| **BUG-07** | Qibla Compass | **Missing Alignment Feedback & Calibration:** No visual/haptic indication occurs when aligned with Qibla, nor is there a magnetometer sensor calibration prompt. | **Medium** | Add haptic vibration on target lock; prompt figure-8 calibration on low sensor precision. |\n| **BUG-08** | Qibla Compass / Header | **Dark Mode Text Contrast Failure:** Header title text *\"Qibla\"* has near-zero visual contrast against dark green gradient background. | **Low** | Update text color token to achieve WCAG AAA contrast ratio in dark mode. |\n| **BUG-09** | Prayer Time | **Incorrect Hijri Date Calculation:** Gregorian date \"3 August\" incorrectly calculates to \"29-10-1447 (Shawwāl 1447)\" instead of 1448 AH. | **High** | Fix backend Hijri converter utility / API response calculation logic. |\n| **BUG-10** | Prayer Time | **UX Visual Ambiguity on Active Reminder:** Notification bell state (green for active alarm on Asr) visually conflicts with identifying the upcoming prayer (Dhuhr), as Dhuhr lacks a distinct active-card state. | **Low** | Add distinct visual highlight/card border to the active \"Next Prayer\" row. |\n| **BUG-11** | Prayer Time | **Unformatted Time String Output:** Displays raw seconds (`12:31:00`) instead of localized 12h/24h standard formatting (`12:31 PM`). | **Low** | Format time objects using standard localized time formatter (`hh:mm a`). |\n| **BUG-12** | Prayer Time | **Missing Juristic & Calculation Settings:** App lacks configuration menus for Islamic Calculation Methods or Asr Juristic (Hanafi/Shafi'i) shadow ratios. | **Medium** | Add settings modal for calculation method (MWL, ISNA, UIC Karachi) and Asr juristic toggle. |\n| **BUG-13** | Fasting Tracker | **Calendar Grid Selection State Mismatch:** Selecting a date in the input modal (`04-Aug-2026`) fails to update the active highlight state on the top calendar grid. | **Medium** | Bind active calendar grid state to date picker selection variable. |\n| **BUG-14** | Fasting Tracker / Header | **Dark Mode Text Contrast Failure:** Header text *\"Fasting\"* lacks proper contrast against dark green gradient top bar. | **Low** | Apply higher contrast color token for header title components in dark mode. |\n| **BUG-15** | Fasting Tracker / Calendar | **False Active State & Unresponsive Date:** Unlogged dates (e.g., Aug 10) render as solid green active states, blocking user tap interactions and modal trigger. | **High** | Fix calendar state mapping to check valid log array before rendering active green style. |\n| **BUG-16** | Fasting Tracker / Logging Logic | **Missing Duration Validation Logic:** System permits logging non-Islamic / invalid fast durations (e.g., 8:00 PM to 12:00 AM, 4 hours) without warning or validation. | **Medium** | Implement duration/time window validation rules prior to submitting fast entries. |\n| **BUG-17** | QuickFit / Modal | **Missing Input Type & Length Validation:** Category inputs accept numeric test strings (`2123...`) and uncapped lengths without validation. | **High** | Implement string validation (`alpha-only`, `max_length <= 20`) on category tag inputs. |\n| **BUG-18** | QuickFit / Modal | **Unsanitized Input & Modal Text Overflow:** Unsanitized string injection repeats dynamically inside modal titles, overflowing container boundaries and truncating words (`communit Categories`). | **High** | Sanitize modal interpolation variables; apply CSS overflow `text-overflow: ellipsis`. |\n| **BUG-19** | QuickFit / Formatting | **Missing String Normalization:** Category and subcategory strings lack casing normalization (`toTitleCase()`), rendering mixed casing (`\"back\"`, `\"forearm\"` vs. `\"Biceps\"`). | **Low** | Enforce standard capitalization helper (`toTitleCase()`) on all category tag renders. |\n| **BUG-20** | QuickFit / Modal | **Missing Empty-State Handling:** Opening categories with zero available exercises (**Abdominals**, **Neck**, **back**) renders a completely blank modal sheet without feedback or loader graphics. | **Medium** | Add fallback UI graphic/message (*\"No exercises found for this target zone\"*). |\n| **BUG-21** | QuickFit / Modal Header | **Unsanitized String Interpolation in Headers:** Dynamic modal titles append `\" Categories\"` to raw string variables without validation, producing grammatically broken headers (e.g., `back Categories`). | **Low** | Normalize string headers before appending template literals (`${capitalize(category)} Categories`). |\n| **BUG-22** | QuickFit / Data Integrity | **Missing Subcategory Deduplication / Array Overlap:** Selecting overlapping body zones (e.g., `Lower Body` vs `Legs`) returns duplicate subcategories (like `Hamstrings`) rather than pulling from a single-source normalized taxonomy. | **High** | Implement array deduplication logic (`Array.from(new Set(...))`) across taxonomy endpoints. |\n| **BUG-23** | Community Feed | **Uncontrolled Inline Card Expansion:** Expanding long post text pushes feed content down indefinitely without applying max-height constraints, internal overflow scrollbars, or a collapse control. | **High** | Implement max-height limits on expanded cards or open long posts in a separate detail view modal. |\n| **BUG-24** | Community Feed | **False Expansion Button Trigger:** The `more` action trigger renders unconditionally on short posts (e.g., 3-word posts like `Post with images🌍`) where text is not truncated. | **Medium** | Add conditional check (`text.length > MAX_CHAR || lines > 3`) before rendering the expand trigger. |\n| **BUG-25** | Community Feed | **Non-Standard Copy & Missing Collapse Toggle:** Expand action uses lowercase copy (`more`) instead of standard `See More`, and fails to toggle to `See Less` / `Show Less` when expanded. | **Low** | Standardize UI copy to `See More` / `See Less` and toggle the state onClick. |\n| **BUG-26** | Community Feed & Post Creation | **Low-Resolution / Pixelated Icon Assets:** Action buttons and attachment icons (e.g., post media upload button) use low-density raster assets, rendering pixelated on high-DPI screens. | **Low** | Replace PNG/JPG icons with vector-based SVGs or high-density `@3x` / `xxhdpi` bitmap assets. |\n| **BUG-27** | Community / Creation Flow | **Inconsistent Terminology Across Flow (Squad vs Community):** Copy toggles arbitrarily between \"Squad\" and \"Community\" across headers, inputs, empty states, and modal dialogs. | **Low** | Standardize copy tokens across the app (choose either \"Squad\" or \"Community\" globally). |\n| **BUG-28** | Community / Creation Flow | **Incorrect Navigation Stack Route After Creation:** Selecting \"No\" on the post-creation modal routes the user directly to the Home Dashboard instead of pushing the newly created Community feed. | **High** | Replace route stack reset with direct navigation to `CommunityDetailView(communityId)`. |\n| **BUG-29** | Community / Feed View | **Unstyled / Generic Empty State (`No Data Found`):** Newly created empty communities display unstyled raw text (`No Data Found`) without a user-friendly illustration or prompt to post. | **Low** | Replace with a styled empty-state component containing an onboarding prompt (*\"No posts yet. Start the conversation!\"*). |\n| **BUG-30** | Workout Hub | **Non-Functional Action Icons (Dead UI Controls):** Two out of the three action icons on the active plan card (Swap/Transfer and Scan) are completely un-clickable/unresponsive, with only the middle edit icon being functional. | **High** | Wire up proper click handlers to active routes or remove un-implemented icons from the UI. |\n| **BUG-31** | Workout Hub | **Dead-End Active Plan Validation Modal:** The warning modal instructs users to *\"Please deactivate it first\"*, but offers only an `\"Okay\"` button without providing a direct deactivation action or navigating to deactivation settings. | **Medium** | Replace the passive \"Okay\" dialog with an actionable modal containing a direct `\"Deactivate Current Plan\"` button or link. |\n| **BUG-32** | Workout Hub | **Low-Density / Pixelated Plan Action Icons:** The action icons inside the active plan card (swap, edit, scan) suffer from severe pixelation on high-DPI screens due to low-resolution bitmap rendering. | **Low** | Replace raster PNG icons with SVG vectors or resolution-independent vector drawables. |\n| **BUG-33** | Learning / Content Feed | **Broken Character Encoding (Unparsed Unicode/Emojis):** Article descriptions fail to render UTF-8 emoji strings, displaying raw `????` replacement characters instead of proper visual emojis. | **Medium** | Ensure proper UTF-8 string encoding/decoding on backend API responses and frontend text rendering components. |\n| **BUG-34** | Learning / Content Feed | **Raw CMS Field Suffixes Leaked (`Desc` Truncation):** Description text fields across multiple categories display raw placeholder strings like `There's 20% off on Membership Desc` and `Nutrition Tip 1 Desc`. | **Medium** | Clean production CMS data tables and sanitize field parsing to strip debug suffixes. |\n| **BUG-35** | Learning / Content Feed | **Misplaced Asset Mapping & Image UI Overlays:** Articles display irrelevant default 3D body mesh assets with broken card overlays (`Current state November, 17th`) instead of proper article thumbnail graphics. | **Low** | Update CMS image URL mappings with correct high-res stock/promo graphics. |\n| **BUG-36** | Global Bottom Navigation | **Non-Functional Bottom Navbar Icons (Apple & Heart Tabs):** The Apple (Nutrition) and Heart (Health/Metrics) icons on the persistent global navigation bar are un-clickable/unresponsive, failing to navigate to their respective screens. | **High** | Implement route bindings and state handlers for the Apple and Heart tabs in the primary scaffold bottom navigation bar. |\n| **BUG-37** | Profile Screen | **Low-Resolution / Blurry Profile Avatar Asset:** The default user avatar placeholder image renders extremely blurry and pixelated due to low-density raster asset scaling. | **Low** | Replace standard low-res PNG avatar with a scalable vector (SVG) or higher-density (`@3x`) asset variant. |\n| **BUG-38** | Notifications | **Hardcoded Mock Data & Duplicate Timestamps:** The notifications feed displays identical duplicated push alerts across both \"Today\" and \"Yesterday\" sections with static hardcoded timestamps (`9:01am`). | **Medium** | Wire the notifications screen to a dynamic notification service API with proper date filtering. |\n| **BUG-39** | Profile / Change Password | **Unresponsive View & Back Navigation Lock:** Tapping \"Change Password\" fails to load the form and breaks back button navigation (`<`), locking the user on the screen. | **High** | Fix unhandled route exception in `ChangePasswordView` and ensure back button handler is wrapped in `WillPopScope` / `PopScope`. |\n| **BUG-40** | Notification Settings | **Horizontally Stretched UI Toggle Switches:** Toggle switches across all notification items render stretched and visually distorted due to unconstrained flex layout bounds. | **Low** | Wrap switch widgets in fixed-width containers (`width: 48.0`, `height: 28.0`) to preserve native switch aspect ratio. |\n| **BUG-41** | Subscriptions View | **Missing SafeArea Padding on Sticky Header:** Scrolling down the subscription list pushes header text (\"Current Plan\") directly into the system status bar, obscuring the back navigation arrow. | **Medium** | Wrap subscription header view scaffold in a `SafeArea` widget to prevent status bar layout overlap. |\n| **BUG-42** | Daily Power Minutes | **Blank Form Scaffold (`Fill Information` Screen):** Opening \"Your Daily Power Minutes\" loads a screen titled \"Fill Information\" with a functional \"Next\" button but zero form fields or inputs. | **High** | Wire proper form field components/controllers to the `FillInformation` view scaffold. |\n| **BUG-43** | Daily Power Minutes | **Exposed `unknown status` Fallback & Infinite Loading:** Submitting the empty \"Fill Information\" form triggers a spinner displaying raw API fallback text (`unknown status`) without error handling. | **High** | Implement form validation before submission and add proper user-friendly error dialogs for API failures. |\n| **BUG-44** | Daily Power Minutes | **Broken Navigation Loop / Aborted Feature Flow:** Failing the \"Fill Information\" request drops the user back onto the Home Dashboard, preventing access to the Power Minutes feature. | **High** | Prevent routing resets on API failure and keep the user on an actionable retry state. |\n| **BUG-45** | Home Dashboard | **Header View Clipping Status Bar:** Returning from the Power Minutes flow pushes the top profile header off-screen, clipping the user avatar into the system status bar. | **Medium** | Wrap the top header bar of `HomeView` in a `SafeArea` widget to maintain top padding constraints. |\n| **BUG-46** | Sign-Up Flow | **Form Fields Obscured by Soft Keyboard (Missing Bottom Inset Padding):** Focusing on the Password and Confirm Password text fields causes the soft keyboard to completely cover the focused input fields and the submit button without auto-scrolling into view. | **High** | Wrap the Sign-Up form in a `SingleChildScrollView` and enable `resizeToAvoidBottomInset: true` on the Scaffold. |\n| **BUG-47** | Sign-Up Flow | **Missing Input Length & Format Validation (Phone Number):** Mobile number input accepts arbitrary digit lengths (e.g., 18 digits: `0316111998488454`) without enforcing localized 11-digit phone number formatting or regex validation. | **High** | Apply regex validator (`r'^((\\+92)|(03))\\d{9}$'`) and enforce `maxLength: 11` on the text field. |\n| **BUG-48** | Sign-Up Flow | **Missing Password Complexity Enforcement:** Password fields accept weak, simple strings (e.g., `Oli_sykes`) without enforcing minimum security policy standards (uppercase, special char, digit, min 8 chars). | **High** | Implement strict password complexity regex validation on both client form state and backend DTOs. |\n| **BUG-49** | Auth / OTP Verification | **Failing OTP Delivery Service:** Advancing past the registration form routes to the `Verify` screen, but the backend fails to trigger or deliver the verification passcode email/SMS to the user. | **Critical** | Fix backend email/SMS gateway configuration (`SMTP` / `Twilio` / `Firebase Auth`) on the `send-otp` controller. |\n| **BUG-50** | Sign-Up Flow | **Missing \"Password Match\" Validation Feedback:** The form provides no real-time or submission-time visual feedback to inform the user whether the \"Password\" and \"Confirm Password\" fields match. | **Medium** | Implement a client-side validator to check equality between the two password fields and display an inline error message when mismatched. |\n| **BUG-51** | Auth / Backend Registration | **Premature Database Insertion Prior to OTP Verification:** Submitting step 1 of registration instantly creates a user record in the DB (logged in Admin Portal as `New Lead`) before OTP/email verification is completed. | **Critical** | Store pending registrations in Redis/temp storage and only execute database insert after `verify-otp` passes. |\n\n---\n\n## 3. Feature Suggestions & Enhancements\n\n| Suggestion ID | Feature / Module | Enhancement Description | Priority | Target UX Impact |\n| :--- | :--- | :--- | :--- | :--- |\n| **SUGG-01** | Fasting Tracker | **Auto-Fill Islamic Fasting Window:** Provide a quick-action button in the entry modal (*\"Set to Today's Fast\"*) that automatically populates `Start Time = Fajr` (Suhoor cut-off) and `End Time = Maghrib` (Iftar) using the user's localized prayer calculations. | **High** | Reduces user input friction by eliminating standard 12-hour clock pickers for daily Islamic fasts. |\n| **SUGG-02** | Community Feed | **Enforce Character & Truncation Rules (Posts & Comments):** Implement standard character limits and truncation thresholds. Posts should truncate after **280–300 characters (or ~3–4 lines)** with a `See More` toggle, enforcing a hard post limit of **2,000–3,000 characters**. Comments should truncate after **150–200 characters (or ~2 lines)** with a hard limit of **500–1,000 characters**. | **High** | Keeps the feed scannable, prevents single posts/comments from dominating viewport height, and improves overall scroll performance. |\n| **SUGG-03** | Workout Hub | **Direct Plan Management & Deactivation Controls:** Add a dedicated **Deactivate / Cancel Plan** option directly inside the workout plan card menu (or context sheet) so users can easily manage active subscriptions/plans without running into blocked creation states. | **High** | Streamlines plan lifecycle management and resolves dead-end creation blocking alerts. |\n";
        
        // Render markdown
        document.getElementById('content').innerHTML = marked.parse(markdownContent);
        
        // Add dynamic styling to severity badges (4th column in the table)
        document.querySelectorAll('table').forEach(table => {
            const rows = table.querySelectorAll('tr');
            rows.forEach(row => {
                const cells = row.querySelectorAll('td');
                if(cells.length >= 4) {
                    const severityCell = cells[3];
                    const text = severityCell.innerText.trim().toLowerCase();
                    
                    let badgeClass = '';
                    let bgColor = '';
                    let textColor = '';
                    
                    if(text.includes('high')) {
                        bgColor = 'rgba(239, 68, 68, 0.15)';
                        textColor = '#fca5a5';
                        border = '1px solid rgba(239, 68, 68, 0.3)';
                    } else if(text.includes('medium')) {
                        bgColor = 'rgba(245, 158, 11, 0.15)';
                        textColor = '#fcd34d';
                        border = '1px solid rgba(245, 158, 11, 0.3)';
                    } else if(text.includes('low')) {
                        bgColor = 'rgba(16, 185, 129, 0.15)';
                        textColor = '#6ee7b7';
                        border = '1px solid rgba(16, 185, 129, 0.3)';
                    }
                    
                    if (bgColor) {
                        const originalHtml = severityCell.innerHTML;
                        // Strip the bold tags if present to clean up the badge text
                        const cleanText = severityCell.innerText;
                        severityCell.innerHTML = `<span class="badge" style="background: ${bgColor}; color: ${textColor}; border: ${border}">${cleanText}</span>`;
                    }
                }
            });
        });
    </script>
</body>
</html>
